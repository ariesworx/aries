<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aries brand concepts</title>
<style>
  :root {
    --ink: #0B1D2E;
    --brass: #C9A227;
    --sky: #4A7A9B;
    --star: #F4F7FA;
    --paper: #F7F5F0;
    --night: #071018;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 20% 0%, #dfe8f0 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, #e8dfc8 0%, transparent 45%),
      var(--paper);
    line-height: 1.45;
  }
  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 1.5rem 1.5rem;
  }
  header h1 {
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 0.4rem;
  }
  header p { margin: 0; max-width: 40rem; opacity: 0.85; }
  .palette {
    display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.25rem;
  }
  .swatch {
    display: flex; align-items: center; gap: 0.5rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.8rem;
  }
  .swatch i {
    width: 1.25rem; height: 1.25rem; border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.12); display: inline-block;
  }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1rem 1.5rem 4rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.25rem;
  }
  article {
    border: 1px solid rgba(11,29,46,0.12);
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(4px);
  }
  article h2 {
    margin: 0;
    padding: 0.85rem 1rem 0.15rem;
    font-size: 1.05rem;
    font-weight: 600;
  }
  article .meta {
    padding: 0 1rem 0.75rem;
    font-size: 0.85rem;
    opacity: 0.75;
  }
  .grounds {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .ground {
    display: flex; align-items: center; justify-content: center;
    padding: 1.25rem;
    min-height: 160px;
  }
  .ground.light { background: #fff; }
  .ground.dark { background: var(--night); }
  .ground img { width: 112px; height: 112px; }
  .files {
    padding: 0.65rem 1rem 0.9rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.72rem;
    border-top: 1px solid rgba(11,29,46,0.08);
    opacity: 0.7;
  }
</style>
</head>
<body>
<header>
  <h1>Aries brand concepts</h1>
  <p>Ten celestial-navigation marks (no astrology, no ram). SVG is the source of truth; PNG exports are in <code>png/</code>. Compare each on light and dark grounds.</p>
  <div class="palette" aria-label="Palette">
    <span class="swatch"><i style="background:#0B1D2E"></i>#0B1D2E ink</span>
    <span class="swatch"><i style="background:#C9A227"></i>#C9A227 brass</span>
    <span class="swatch"><i style="background:#4A7A9B"></i>#4A7A9B sky</span>
    <span class="swatch"><i style="background:#F4F7FA;border-color:#ccc"></i>#F4F7FA star</span>
  </div>
</header>
<main class="grid" id="grid"></main>
<script>
const marks = [
  ["01-polaris", "Polaris", "North star with compass rays. Strong at favicon size."],
  ["02-sextant", "Sextant", "Graduated arc and index arm. Ties to the Sextant binary."],
  ["03-bearings", "Bearings", "Cardinal ring and centered fix. Orchestrator metaphor."],
  ["04-first-point", "First Point of Aries", "Equator crossed by the ecliptic. The navigational name."],
  ["05-star-path", "Star Path", "Guide stars along a great-circle course."],
  ["06-compass-rose", "Compass Rose", "Eight-point rose with brass north."],
  ["07-meridian", "Meridian", "Horizon, meridian, and a star at altitude."],
  ["08-azimuth", "Azimuth", "Azimuth ring with a bearing to a guide star."],
  ["09-sight-a", "Sight A", "Letter A as a navigational sight / wordmark."],
  ["10-celestial-fix", "Celestial Fix", "Three lines of position meet at one fix."],
];
const grid = document.getElementById("grid");
for (const [id, name, blurb] of marks) {
  const el = document.createElement("article");
  el.innerHTML = `
    <h2>${id.slice(0,2)}. ${name}</h2>
    <p class="meta">${blurb}</p>
    <div class="grounds">
      <div class="ground light"><img src="logos/${id}.svg" alt="${name} on light"></div>
      <div class="ground dark"><img src="logos/on-dark/${id}.svg" alt="${name} on dark"></div>
    </div>
    <div class="files">logos/${id}.svg · png/${id}-*.png</div>`;
  grid.appendChild(el);
}
</script>
</body>
</html>
