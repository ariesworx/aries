# nginx as an operator would put it in front of ariesd: TLS with the
# site's certificate, HTTP/2 to clients, HTTP/1.1 to the daemon over TLS
# with the internal CA, and the two lines a WebSocket needs on its path.
# Everything else is nginx's default, buffering included
# (proxy_buffering on, proxy_request_buffering on), which is what the
# spike measures the pipes against (RESULTS.md, section 3).
server {
    listen 443 ssl;
    http2 on;
    server_name proxy.internal;
    ssl_certificate     /certs/proxy.internal.pem;
    ssl_certificate_key /certs/proxy.internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_ssl_server_name on;
    proxy_ssl_name aries.internal;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /certs/ca.pem;

    location /v1/connect {
        proxy_pass https://aries.internal:8443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # nginx closes a connection idle for 60 s; the daemon pings every 25 s.
    }

    location / {
        proxy_pass https://aries.internal:8443;
    }
}
