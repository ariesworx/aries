# The contributor license agreement check (CLA.md, design decisions 84
# and 94).
#
# On a pull request, internal/tools/cla lists who must have signed (its
# author and every commit's author, less the allowed) and fails this check
# until each has, keeping one comment on the pull request that says who
# and how. Their comment of CLA.md's sentence records the signature as
# JSON on the cla-signatures branch, not main (main's ruleset refuses
# direct pushes), and reruns the pull request's check.
#
# pull_request_target and issue_comment run this workflow from the base
# branch with write access: actions/checkout then checks out the base
# branch, whose tool runs, never the pull request's code.
#
# cla is a required check in the "Protect main" ruleset, and a required
# check must report in the merge queue too. So the workflow also runs on
# merge_group, where the job is skipped: the agreement was checked on the
# pull request before it could be queued, and GitHub counts a skipped
# required check as passing. Dependabot's pull requests are skipped the
# same way: its runs get a read-only token, and a bot contributes nothing
# copyrightable.
name: cla
on:
  merge_group:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
jobs:
  cla:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, 'recheck') ||
        contains(github.event.comment.body, 'I hereby sign the CLA')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch: the default for both events.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go at go.mod's toolchain line
        uses: ./.github/actions/go-toolchain
      - name: Check the agreement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOFLAGS: -mod=readonly
          # The maintainers' GitHub logins, comma-separated: a repository
          # variable, so that no account is named here and a fork sets its
          # own. Unset, every human contributor must sign.
          CLA_ALLOW: ${{ vars.CLA_ALLOW }}
        # The maintainer holds the copyright already; bots contribute
        # nothing copyrightable.
        run: >-
          go run ./internal/tools/cla
          --document https://github.com/ariesworx/aries/blob/main/CLA.md
          --allow "$CLA_ALLOW,*[bot]"
          --branch cla-signatures
          --file signatures/cla.json
