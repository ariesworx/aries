# The contributor license agreement check (CLA.md, design decision 84).
#
# On a pull request from someone who has not signed, CLA Assistant Lite
# posts the agreement and the sentence to comment, and fails this check
# until they comment it. Signatures are recorded as JSON on the
# cla-signatures branch, not main: main's ruleset refuses direct pushes,
# and the action commits each signature itself.
#
# pull_request_target runs this workflow from the base branch with write
# access, so it never checks out or runs the pull request's code.
#
# cla is a required check in the "Protect main" ruleset, and a required
# check must report in the merge queue too. So the workflow also runs on
# merge_group, where the job is skipped: the agreement was checked on the
# pull request before it could be queued, and GitHub counts a skipped
# required check as passing. Dependabot's pull requests are skipped the
# same way: its runs get a read-only token, so the action could not record
# anything, and a bot contributes nothing copyrightable.
name: cla
on:
  merge_group:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/ariesworx/aries/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The maintainer holds the copyright already; bots contribute
          # nothing copyrightable.
          allowlist: edwardfward,*[bot]
          lock-pullrequest-aftermerge: false
