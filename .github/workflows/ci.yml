name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the required checks (lint, test) on each pull
  # request as it would merge, on a temporary branch of its own.
  merge_group:
  # release.yml runs this same gate on the tagged commit before it builds.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are canceled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # go.mod and go.sum as they are, whatever a GOFLAGS elsewhere says
  # (docs/design/supply-chain.md, §7.4). GOTOOLCHAIN is not set here:
  # setup-go reads go.mod's go line instead of its toolchain line when it
  # is, and sets GOTOOLCHAIN=local itself for the steps after it.
  GOFLAGS: -mod=readonly
  # The major version of Postgres the tests run on (version.PostgresMajor,
  # internal/version), from the PostgreSQL project's apt repository.
  POSTGRES_MAJOR: "18"
  # The fingerprint of that repository's signing key, ACCC4CF8, which the
  # key downloaded is checked against before apt trusts it.
  PGDG_KEY_FINGERPRINT: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8

# AGENTS.md's Commands block lists this gate, and scripts/gate.sh runs it
# on a contributor's machine: change all three together. Tests in
# scripts/ and internal/version fail when their commands or pins differ.
#
# The caches. Each job keeps Go's build cache under a key of its own, so
# that it holds what that job builds: objects compiled with the race
# detector for test, and those for macOS and Windows for lint. The module
# cache is one more, which both read. setup-go's own cache is off, because
# it is one key for every job and the first job to finish fills it.
# - A key names the Go version and the hash of go.sum and the tools
#   module's (internal/tools/pin), and there are no restore keys: a cache
#   is used by the Go and the modules that made it, or not at all.
# - Only a push to main saves, and only when the key is new, which is
#   once for each pair of go.sum files. A pull request, and the merge
#   queue's run of one, reads main's caches and writes none.
# - Any other run, the release's gate on a tag among them (workflow_call
#   keeps the caller's github context), neither restores nor saves: it
#   downloads every module and compiles everything.
# - go test never takes a result from the cache: -shuffle=on is not one of
#   the flags go caches results for (go help test), and a test in
#   internal/release keeps the flag.
jobs:
  lint:
    runs-on: ubuntu-24.04
    # A hang ends here, not at GitHub's six hours. The slowest of 78 lint
    # jobs read took 172 s (docs/design/ci-analysis.md, §3.1).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Go at go.mod's toolchain line
        # What setup-go installed, with no other toolchain to download.
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          if [ "$(go env GOVERSION)" != "$want" ] || [ "$(go env GOTOOLCHAIN)" != local ]; then
            echo "::error::go is $(go env GOVERSION) with GOTOOLCHAIN=$(go env GOTOOLCHAIN); want go.mod's toolchain line, $want, with GOTOOLCHAIN=local"
            exit 1
          fi
      - name: restore the module cache
        id: mod-cache
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'internal/tools/pin/go.sum') }}
      - name: restore the build cache
        id: build-cache
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-lint-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'internal/tools/pin/go.sum') }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: go mod verify
        # The module cache still matches go.sum, the main module's and the
        # tools module's.
        run: |
          go mod download && go -C internal/tools/pin mod download
          go mod verify && go -C internal/tools/pin mod verify
      - name: go mod tidy
        # go.mod and go.sum are what go mod tidy would make them.
        run: go mod tidy -diff && go -C internal/tools/pin mod tidy -diff
      - name: shellcheck
        # Every shell script in the repository. shellcheck is preinstalled
        # on GitHub's Ubuntu runners.
        run: git ls-files -co --exclude-standard -z "*.sh" | xargs -0 shellcheck
      - name: AppArmor profile syntax
        # apparmor_parser is part of Ubuntu and of GitHub's Ubuntu runners.
        # -Q compiles without loading and -K skips the cache, so it needs
        # no root and changes nothing; -I finds this checkout's tunables.
        # It checks syntax only, not that ariesd works when confined
        # (deploy/apparmor/README.md).
        run: /usr/sbin/apparmor_parser -Q -K -I deploy/apparmor deploy/apparmor/ariesd deploy/apparmor/ariesd-stdio
      - name: govulncheck
        # Pinned by the tools module's go.mod and go.sum.
        run: go tool -modfile=internal/tools/pin/go.mod govulncheck ./...
      - name: cross-platform build
        # The client must build and vet on every developer OS, not only Linux.
        run: |
          for os in darwin windows; do
            GOOS=$os GOARCH=amd64 go vet ./...
            GOOS=$os GOARCH=amd64 go build ./cmd/...
          done
      - name: save the module cache
        # This job's, not test's: go mod download fetched every module, and
        # govulncheck's are here too.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.mod-cache.outputs.cache-primary-key }}
      - name: save the build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  # The AppArmor profiles' syntax under Ubuntu 26.04's parser (AppArmor
  # 5), as lint checks it under 24.04's (AppArmor 4): docs/server.md
  # supports both. A checkout and one command, with no Go.
  apparmor-26-04:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AppArmor profile syntax
        run: /usr/sbin/apparmor_parser -Q -K -I deploy/apparmor deploy/apparmor/ariesd deploy/apparmor/ariesd-stdio

  # The store tests run against a real Postgres, from the PostgreSQL
  # project's apt repository, whose key is checked.
  test:
    runs-on: ubuntu-24.04
    # A hang ends here, not at GitHub's six hours. The slowest of 78 test
    # jobs read took 515 s, and 302 s since the tests drop their databases
    # (docs/design/ci-analysis.md, §3.2). It is also more than go test's
    # own ten minutes for a package on top of the build, so a test that
    # hangs is still reported by go test, with its stacks.
    timeout-minutes: 30
    env:
      # A test on Postgres fails rather than skips when postgres is
      # missing, so the job cannot pass without running them
      # (internal/pgtest).
      ARIES_REQUIRE_POSTGRES: "1"
      # The memory file system the tests' temporary files go on, when it
      # is fit for them ("temporary directory for the tests", below). Set
      # it to "" to put them back on the runner's disk, in /tmp.
      TESTS_TMPFS: /dev/shm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Go at go.mod's toolchain line
        # What setup-go installed, with no other toolchain to download.
        run: |
          want=$(sed -n 's/^toolchain //p' go.mod)
          if [ "$(go env GOVERSION)" != "$want" ] || [ "$(go env GOTOOLCHAIN)" != local ]; then
            echo "::error::go is $(go env GOVERSION) with GOTOOLCHAIN=$(go env GOTOOLCHAIN); want go.mod's toolchain line, $want, with GOTOOLCHAIN=local"
            exit 1
          fi
      - name: restore the module cache
        # The lint job saves it.
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'internal/tools/pin/go.sum') }}
      - name: restore the build cache
        id: build-cache
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-test-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'internal/tools/pin/go.sum') }}
      - name: Install Postgres
        # Its programs only: no cluster is made or started, since each
        # test package starts its own servers (internal/pgtest). The key is
        # checked against its fingerprint before apt is told to trust it.
        run: |
          key=$RUNNER_TEMP/pgdg.asc
          curl -fsSL -o "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          got=$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$got" != "$PGDG_KEY_FINGERPRINT" ]; then
            echo "::error::the apt repository's key has fingerprint ${got:-none}, want $PGDG_KEY_FINGERPRINT"
            exit 1
          fi
          sudo install -D -m 0644 "$key" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo install -d /etc/postgresql-common/createcluster.d
          echo "create_main_cluster = false" | sudo tee /etc/postgresql-common/createcluster.d/aries-ci.conf
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-$POSTGRES_MAJOR"
          echo "/usr/lib/postgresql/$POSTGRES_MAJOR/bin" >>"$GITHUB_PATH"
          "/usr/lib/postgresql/$POSTGRES_MAJOR/bin/postgres" --version
      - name: temporary directory for the tests
        id: tmp
        # Each package's Postgres servers keep their data under the
        # temporary directory, and on disk much of the suite's time was the
        # database waiting for it (docs/design/ci-analysis.md, §4.5, which
        # measured Dolt). This picks a directory in memory for the next
        # step, or /tmp, where they have always been, with a warning that
        # says why.
        #
        # The files count as memory. A run's were a quarter of a gigabyte
        # at their most when measured on Dolt, and every database server
        # and test binary together 2 GB more, of the runner's 16 GB; the mount must have
        # 4 GB free and the machine 8 GB, or the files stay on disk. A
        # mount that fills fails the tests' writes, and the tests with
        # them; it does not block them.
        run: |
          dir=/tmp
          if [ -z "$TESTS_TMPFS" ]; then
            echo "TESTS_TMPFS is empty: the tests' temporary files are on disk"
          else
            kind=$(stat -f -c %T "$TESTS_TMPFS" 2>/dev/null) || kind=missing
            free_mb=$(df -Pm "$TESTS_TMPFS" 2>/dev/null | awk 'NR == 2 { print $4 }')
            mem_mb=$(awk '$1 == "MemAvailable:" { print int($2 / 1024) }' /proc/meminfo)
            try=$TESTS_TMPFS/aries-tests
            # The tests run programs they write there: stand-ins for the
            # tools scripts/gate.sh calls, and a binary to upgrade to.
            probe() {
              mkdir -p "$try" && printf '#!/bin/sh\nexit 0\n' >"$try/probe" &&
                chmod +x "$try/probe" && "$try/probe" && rm "$try/probe"
            }
            if [ "$kind" != tmpfs ]; then
              why="it is $kind, not a memory file system"
            elif [ "${free_mb:-0}" -lt 4096 ]; then
              why="it has ${free_mb:-0} MB free, and the tests are given 4096"
            elif [ "${mem_mb:-0}" -lt 8192 ]; then
              why="the machine has ${mem_mb:-0} MB of memory available, under 8192"
            elif ! probe; then
              why="a program written there does not run"
            else
              why=
              dir=$try
            fi
            if [ -n "$why" ]; then
              echo "::warning::The tests' temporary files are on disk, not on $TESTS_TMPFS: $why."
            fi
          fi
          echo "dir=$dir" >>"$GITHUB_OUTPUT"
          echo "The tests' temporary files go in $dir"
          df -h "$dir"
          free -m
      - name: go test
        # -shuffle=on randomizes test order; the seed is in the log, and
        # -shuffle=SEED replays a failure. go builds and runs the test
        # binaries from GOTMPDIR, which stays on disk: they are half a
        # gigabyte at a time, and gain nothing from memory. go test makes
        # each t.TempDir there too, since GOTMPDIR is set.
        #
        # scripts/leftovers.sh gives the tests a TMPDIR of their own under
        # the directory the step above chose, so Postgres's files stay where
        # that step put them, and a GOTMPDIR of their own under /tmp. It
        # fails the step when the tests passed but left a file in either
        # or a process running, and names each, with the test that
        # probably made it, in the log and in an annotation. The coverage
        # profile is written here, in the checkout, as before.
        env:
          TMPDIR: ${{ steps.tmp.outputs.dir }}
          GOTMPDIR: /tmp
        run: scripts/leftovers.sh go test -race -shuffle=on -coverprofile=coverage.out ./...
      - name: end-to-end over HTTPS
        # The end-to-end suite again, its users on HTTPS where the run
        # above has them on SSH: the same tests on both transports
        # (docs/design/transport.md, §15, T1's gate).
        env:
          TMPDIR: ${{ steps.tmp.outputs.dir }}
          GOTMPDIR: /tmp
        run: ARIES_E2E_TRANSPORT=https scripts/leftovers.sh go test -race -shuffle=on ./internal/e2e/
      - name: temporary directory after the tests
        # What the tests left there, and the machine's memory, whether
        # they passed or not.
        if: ${{ !cancelled() && steps.tmp.outputs.dir != '' }}
        env:
          DIR: ${{ steps.tmp.outputs.dir }}
        run: |
          df -h "$DIR"
          free -m
      - name: build the peer check's test binary
        # As the runner's user, from the build cache the tests have just
        # filled, so that go never runs as root: root would need a cache of
        # its own, and compile the package and all it imports a second
        # time.
        run: go test -race -c -o "$RUNNER_TEMP/server.test" ./internal/server
      - name: peer check as another user
        # TestCheckPeerOtherUID and TestCheckPeerKeepsStatusFromOtherUsers
        # dial the daemon's socket from a process running as nobody, which
        # needs root; go test above skips them. Only the binary runs as
        # root, in the package's directory as go test would run it, and
        # under scripts/leftovers.sh, as the tests above do: what root
        # leaves only root can remove. sudo does not pass TMPDIR or
        # GOTMPDIR on, so the script's directory is in /tmp; the script
        # lets the user nobody pass through it, as through /tmp.
        # GITHUB_ACTIONS is passed so that what it reports is an
        # annotation too.
        #
        # A pattern that matches no test passes, and so does a test that
        # skips, so the step fails unless the log says both tests passed
        # and none was skipped. scripts/gate.sh prints this command for a
        # contributor, and a test in scripts/ keeps the two alike.
        run: |
          log=$RUNNER_TEMP/peer-check.log
          failed=0
          (cd internal/server && sudo env "PATH=$PATH" ARIES_REQUIRE_POSTGRES=1 GITHUB_ACTIONS=true \
            ../../scripts/leftovers.sh "$RUNNER_TEMP/server.test" -test.run '^TestCheckPeer' -test.v) >"$log" 2>&1 || failed=1
          cat "$log"
          for t in TestCheckPeerOtherUID TestCheckPeerKeepsStatusFromOtherUsers; do
            if ! grep -q "^--- PASS: $t " "$log"; then
              echo "::error::$t did not run and pass as root"
              failed=1
            fi
          done
          if grep -q -e '--- SKIP' "$log"; then
            echo "::error::a test of the peer check was skipped"
            failed=1
          fi
          exit "$failed"
      - name: coverage
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: save the build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
