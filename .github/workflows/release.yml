name: release
# A pushed vMAJOR.MINOR.PATCH tag first runs the full CI gate on the tagged
# commit (gate: ci.yml, the same lint, tests and builds a pull request
# runs). Only then does it build every archive and checksums.txt and
# attest their provenance (build, no secrets). That run stops there.
#
# Signing is a second run, which the maintainer starts by hand at the same
# tag and which names the first: sign-and-publish signs checksums.txt with
# the release key and publishes the GitHub release. Starting it is the
# approval. It used to be a required reviewer on the `release` environment,
# which GitHub enforces on a private repository only for its Enterprise
# plan; a run that one named person must start holds on every plan.
# `aries upgrade` and `ariesd upgrade` refuse a release whose
# checksums.txt.sig does not verify against internal/release/keys.go. See
# RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_run:
        description: "ID of this tag's build run to sign (from its URL: .../actions/runs/<id>)"
        required: true
        type: string
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag is never built, let alone signed, unless the gate passes on the
  # tagged commit itself, whatever CI said about the branch.
  gate:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-24.04
    # A hang ends here, not at GitHub's six hours; the job takes 122 to 155 s.
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write      # actions/attest-build-provenance
      attestations: write  # actions/attest-build-provenance
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false     # a release builds from a clean module cache

      - name: Check the tag
        # The same pattern as internal/release.TagPattern.
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]{1,32})?$ ]]; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH[-pre]"
            exit 1
          fi

      - name: Verify modules
        # Download checks each module against go.sum and the checksum
        # database; verify checks the cache has not changed since.
        run: go mod download && go mod verify

      - name: govulncheck
        # A release never ships with a known-vulnerable dependency.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build
        # A plain loop: eight static builds and an archive each. CGO off,
        # -trimpath, symbols and DWARF stripped, version stamped; VCS
        # information is kept (go version -m shows the commit). dist lives
        # outside the checkout so the build sees a clean tree.
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          ver="${TAG#v}"
          ldflags="-s -w -X github.com/ariesworx/aries/internal/version.Version=${TAG}"
          export CGO_ENABLED=0
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p "$dist"
          build() { # bin os arch
            local bin=$1 os=$2 arch=$3 exe=$1 stage name
            [[ $os == windows ]] && exe=$bin.exe
            stage="$(mktemp -d)"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "$stage/$exe" "./cmd/$bin"
            cp LICENSE README.md "$stage/"
            touch -d "@$SOURCE_DATE_EPOCH" "$stage"/*
            name="${bin}_${ver}_${os}_${arch}"
            if [[ $os == windows ]]; then
              (cd "$stage" && zip -qX "$dist/$name.zip" "$exe" LICENSE README.md)
            else
              tar -C "$stage" --sort=name --owner=0 --group=0 --numeric-owner \
                --mtime="@$SOURCE_DATE_EPOCH" -cf - "$exe" LICENSE README.md |
                gzip -9n > "$dist/$name.tar.gz"
            fi
          }
          for os in linux darwin windows; do
            for arch in amd64 arm64; do build aries "$os" "$arch"; done
          done
          for arch in amd64 arm64; do build ariesd linux "$arch"; done
          (cd "$dist" && sha256sum -- *.tar.gz *.zip > checksums.txt)
          cat "$dist/checksums.txt"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/dist/checksums.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Say how to sign it
        run: |
          {
            echo "## $TAG is built, and not signed"
            echo
            echo "To sign and publish it, the release approver runs:"
            echo
            echo "\`gh workflow run release.yml --ref $TAG -f build_run=$GITHUB_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

  sign-and-publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # The environment holds ARIES_RELEASE_KEY and RELEASE_APPROVER. It
    # admits only v* tags, which only the maintainer can push, so the
    # workflow that reads the key is always one the maintainer tagged; and
    # the first step refuses anyone but the approver, so nobody else's run
    # of that workflow reads it either.
    environment: release
    permissions:
      actions: read        # the build run, and its artifact
      contents: write      # gh release create
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check who started this, the tag and the build run
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVER: ${{ vars.RELEASE_APPROVER }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          set -euo pipefail
          if [[ -z "$APPROVER" ]]; then
            echo "::error::the release environment has no RELEASE_APPROVER variable (RELEASING.md, one-time setup)"
            exit 1
          fi
          if [[ "$ACTOR" != "$APPROVER" || "$TRIGGERING_ACTOR" != "$APPROVER" ]]; then
            echo "::error::only the release approver signs a release; this run was started by $ACTOR and triggered by $TRIGGERING_ACTOR"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != tag ]] ||
            ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]{1,32})?$ ]]; then
            echo "::error::run this at a vMAJOR.MINOR.PATCH[-pre] tag (--ref), not $GITHUB_REF_TYPE $TAG"
            exit 1
          fi
          if ! [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]; then
            echo "::error::build_run must be a run ID"
            exit 1
          fi
          # The run to sign must be this workflow's own, started by the push
          # of this very tag, on this commit, and green: its gate passed and
          # its archives are the ones this run downloads.
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" \
            --jq '[.path, .event, .head_branch, .head_sha, .conclusion] | join(" ")')"
          want=".github/workflows/release.yml push $TAG $GITHUB_SHA success"
          if [[ "$run" != "$want" ]]; then
            echo "::error::run $BUILD_RUN is '$run', want '$want'"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}

      - name: Check the archives against checksums.txt
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum -c --strict checksums.txt

      - name: Sign checksums.txt
        # The key reaches only this step, through the environment; the tool
        # refuses a key that internal/release/keys.go at this tag lacks.
        env:
          ARIES_RELEASE_KEY: ${{ secrets.ARIES_RELEASE_KEY }}
        run: |
          if [[ -z "${ARIES_RELEASE_KEY:-}" ]]; then
            echo "::error::the release environment has no ARIES_RELEASE_KEY secret (RELEASING.md, one-time setup)"
            exit 1
          fi
          go run ./internal/tools/releasekey sign "$RUNNER_TEMP/dist/checksums.txt"
          go run ./internal/tools/releasekey verify "$RUNNER_TEMP/dist/checksums.txt"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          postgres="$(sed -n 's/^const Postgres = "\(.*\)"$/\1/p' internal/version/version.go)"
          test -n "$postgres"
          pre=()
          [[ $TAG == *-* ]] && pre=(--prerelease)
          notes="Tested with Postgres ${postgres}. \`aries upgrade\` and \`ariesd upgrade\` verify these files; to check a manual download, see README, Install."
          gh release create "$TAG" "$RUNNER_TEMP"/dist/* --verify-tag --title "$TAG" \
            --notes "$notes" --generate-notes "${pre[@]}"
