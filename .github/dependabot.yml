version: 2
# Each ecosystem waits 14 days after a release before it proposes it, and
# Go modules 30 for a new major version (AGENTS.md, rule 4: the cooldown;
# docs/design/supply-chain.md, §7.3). Dependabot takes no major-version
# wait for Actions or images, so their reviewer waits the 30 days. A
# security update does not wait.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: maintenance  # PR titles read "maintenance: bump …"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # The gate's tools (govulncheck), pinned by a module of their own.
  - package-ecosystem: gomod
    directory: /internal/tools/pin
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: maintenance
    groups:
      tools-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: maintenance
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # The images of the Docker test server (deploy/docker), pinned by tag
  # and digest: a new digest for a rebuilt tag, which is how an image
  # takes its base's security fixes, and a new tag for a new release.
  - package-ecosystem: docker-compose
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: maintenance
    ignore:
      # Postgres's major version moves with version.PostgresMajor, by
      # hand (RELEASING.md, Changing the Postgres pin).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # The registry lists architecture-specific tags (0.162.0-386, the
      # 32-bit x86 image) beside a release's multi-architecture tag, and
      # Dependabot proposes one as a newer version. It would replace the
      # index with one architecture's digest, which the pin tests refuse
      # (TestHarnessImagesArePinned). `ignore` matches dependency names
      # and version ranges, not a tag's suffix, so there is no rule for
      # every image: ignore each such tag when it is proposed.
      - dependency-name: otel/opentelemetry-collector
        versions: ["0.162.0-386"]
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: maintenance
    ignore:
      # Go's minor version moves with go.mod's go line, and Ubuntu's
      # release with the installer's, by hand; their digests still move.
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      dockerfile-images:
        patterns: ["*"]
