version: 2
# Each ecosystem waits 14 days after a release before it proposes it, and
# Go modules 30 for a new major version (AGENTS.md, rule 4: the cooldown;
# docs/design/supply-chain.md, §7.3). Dependabot takes no major-version
# wait for Actions or images, so their reviewer waits the 30 days. A
# security update does not wait.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: maintenance  # PR titles read "maintenance: bump …"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # The gate's tools (govulncheck), pinned by a module of their own.
  - package-ecosystem: gomod
    directory: /internal/tools/pin
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
      semver-major-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: maintenance
    groups:
      tools-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: maintenance
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # The images of the Docker test server (deploy/docker), pinned by tag
  # and digest: a new digest for a rebuilt tag, which is how an image
  # takes its base's security fixes, and a new tag for a new release.
  - package-ecosystem: docker-compose
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: maintenance
    ignore:
      # Postgres's major version moves with version.PostgresMajor, by
      # hand (RELEASING.md, Changing the Postgres pin).
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # The collector's tag moves by hand; its digest still moves. Every
      # release has an architecture-specific tag beside its
      # multi-architecture one (0.162.0-386, the 32-bit x86 image), and
      # Dependabot reads that numeric suffix as a version segment
      # (0.162.0.386), newer than the release, so it would always propose
      # one architecture's digest, which TestHarnessImagesArePinned
      # refuses. Ignoring one tag cannot hold: a `versions` entry with a
      # dash matches nothing (it is read as a prerelease, 0.162.0.pre.386),
      # and the next release brings a tag of its own.
      - dependency-name: otel/opentelemetry-collector
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: maintenance
    ignore:
      # Go's minor version moves with go.mod's go line, and Ubuntu's
      # release with the installer's, by hand; their digests still move.
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      dockerfile-images:
        patterns: ["*"]
