# A local Aries test server, for testing only: docs/deploy/docker.md.
#
#   ARIES_KEYS="alice $(cat ~/.ssh/id_ed25519.pub)" docker compose -f deploy/docker/compose.yaml up -d --build
#
# Two containers: `aries`, which runs ariesd, and sshd with SSH on, and `postgres`,
# the official Postgres image, which ariesd reaches over the compose
# network as a Postgres on another machine, with a password for its
# role (docs/server.md, "Managed services"). The password is generated
# on the first start, kept in 0600 files on the volumes, and never
# printed.
#
# ARIES_KEYS holds "NAME TYPE KEY" lines, one principal key each;
# ARIES_ADMINS (comma-separated) defaults to the first name;
# ARIES_PROJECT fixes the project UUID on the first start;
# ARIES_HTTPS_PORT is the HTTPS listener's port on 127.0.0.1, 8443 by
# default, which the server's URL names;
# ARIES_SSH=1 serves SSH beside HTTPS, which is off by default, as on a
# fresh server; with it, add compose.ssh.yaml, which publishes sshd's port
# ARIES_PORT on 127.0.0.1, 2222 by default; the port is not published
# otherwise;
# ARIES_IMAGE is the image to run, aries-dev:local by default;
# ARIES_TZ is the zone the server's processes run in, as TZ, UTC unset.
#
# Telemetry is off unless asked for (docs/deploy/docker.md, "Telemetry"):
#
#   ARIES_TELEMETRY=1 docker compose --profile telemetry up -d --build --wait
#
# ARIES_TELEMETRY=1 has ariesd serve /metrics and push metrics, logs and
# traces to a collector on loopback; the `telemetry` profile runs that
# collector, and the `prometheus` profile a Prometheus with the alert
# rules. Both run in the server's network namespace, because ariesd's
# listener answers on loopback alone. Neither publishes a port or keeps
# a volume.
#
# The `identity` profile runs Keycloak, a local identity provider for
# developing and testing sign-in with no external account and no
# internet (docs/deploy/docker.md, "Sign-in with a local identity
# provider"); a test fixture, never production:
#
#   docker compose --profile identity up -d --wait
#
# Its issuer is http://keycloak.localhost:PORT/realms/aries, the same
# from a browser on the host and from the server's container;
# ARIES_IDENTITY_PORT is that PORT, on 127.0.0.1, 8180 by default.
# ARIES_IDENTITY=1 also has ariesd sign people in at it, as the provider
# `keycloak` (docs/server.md, "Sign-in"), offline: its endpoints written
# out, and its keys from a file the entrypoint exports at start.
#
# The `proxy` profile runs nginx in front of ariesd, which then serves
# plain HTTP on loopback, as behind a load balancer (docs/server.md,
# "Behind a proxy"). It needs ARIES_PROXY=1 as well, which the entrypoint
# reads, since a container cannot see its compose profiles:
#
#   ARIES_PROXY=1 docker compose --profile proxy up -d --build --wait
#
# nginx shares the server's network namespace, as the telemetry profiles
# do, and listens on the HTTPS port in its place.
name: aries-dev
services:
  aries:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ${ARIES_IMAGE:-aries-dev:local}
    # docker-init reaps the processes sshd leaves behind and forwards stop
    # signals to the entrypoint.
    init: true
    environment:
      ARIES_KEYS: ${ARIES_KEYS:-}
      ARIES_ADMINS: ${ARIES_ADMINS:-}
      ARIES_PROJECT: ${ARIES_PROJECT:-}
      ARIES_PORT: ${ARIES_PORT:-2222}
      ARIES_HTTPS_PORT: ${ARIES_HTTPS_PORT:-8443}
      ARIES_SSH: ${ARIES_SSH:-}
      ARIES_TELEMETRY: ${ARIES_TELEMETRY:-}
      ARIES_IDENTITY: ${ARIES_IDENTITY:-}
      ARIES_IDENTITY_PORT: ${ARIES_IDENTITY_PORT:-8180}
      ARIES_PROXY: ${ARIES_PROXY:-}
      ARIES_TZ: ${ARIES_TZ:-}
    ports:
      - 127.0.0.1:${ARIES_HTTPS_PORT:-8443}:8443
      # Grafana, with the observe profile; nothing answers here without it.
      - 127.0.0.1:${ARIES_GRAFANA_PORT:-3000}:3000
    volumes:
      - state:/state
      - dbsecret:/aries-db:ro
      # The test CA and the certificate, which nginx serves with the
      # proxy profile; the entrypoint makes them on the first start.
      - tls:/etc/aries/tls
      # Keycloak's, for its generated client secret, which the entrypoint
      # copies for ariesd with ARIES_IDENTITY=1; empty without the
      # identity profile.
      - identity:/run/aries-identity:ro
    depends_on:
      postgres:
        condition: service_healthy

  # nginx in front of ariesd, with the proxy profile and ARIES_PROXY=1
  # (deploy/docker/nginx.conf). It shares the server's network namespace,
  # so ariesd's loopback listener is all it needs, and it serves HTTPS on
  # the port the server publishes. Digest and tag: a release at least 14
  # days old (AGENTS.md, rule 4).
  nginx:
    profiles: [proxy]
    # Mainline 1.31.6, released 15 September 2026
    image: nginx:1.31.6@sha256:60f0d4e986561e08804f75c211dcaf7fc5455699eada29f42cbe8a0a7253dd86
    network_mode: service:aries
    # Healthy, not just started: the certificate is made by the entrypoint,
    # which with the identity profile first waits for Keycloak.
    depends_on:
      aries:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    # nginx makes its default temporary directories at start, under
    # /var/cache/nginx, even the ones this configuration does not use.
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0700
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - tls:/etc/nginx/tls:ro

  # The database. Its entrypoint gives the official image a superuser
  # password nobody keeps, and init/aries.sh makes ariesd's role and
  # database on the first start, with collation C, as docs/server.md's
  # step 2 does. It publishes no port: only the server's container
  # reaches it, on the compose network.
  postgres:
    # Docker's official image (Debian trixie)
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    entrypoint: ["bash", "/opt/aries/postgres.sh"]
    command: ["postgres"]
    volumes:
      - postgres:/var/lib/postgresql
      - dbsecret:/aries-db
      - ./postgres/postgres.sh:/opt/aries/postgres.sh:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d postgres && test -s /aries-db/password"]
      start_period: 60s
      start_interval: 1s
      interval: 10s

  # An OpenTelemetry Collector that receives what ariesd pushes,
  # scrapes ariesd, and prints all of it:
  # `docker compose logs collector`.
  collector:
    profiles: [telemetry]
    # The core distribution
    image: otel/opentelemetry-collector:0.162.0@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
    command: ["--config", "/etc/otelcol/config.yaml"]
    network_mode: service:aries
    # Healthy, not just started: the certificate is made by the entrypoint,
    # which with the identity profile first waits for Keycloak.
    depends_on:
      aries:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ../observability/collector.yaml:/etc/otelcol/config.yaml:ro
    # It prints every data point it receives, so its log is capped.
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "2"

  # A Prometheus that scrapes ariesd and evaluates the alert
  # rules. Its data is in memory and goes with the container. It
  # listens on loopback in the server's namespace and publishes no port:
  # docs/deploy/docker.md says how to ask it a question.
  prometheus:
    profiles: [prometheus]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --web.listen-address=127.0.0.1:9090
    network_mode: service:aries
    # Healthy, not just started: the certificate is made by the entrypoint,
    # which with the identity profile first waits for Keycloak.
    depends_on:
      aries:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /prometheus:uid=65534,gid=65534,mode=0700
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - ../observability/alerts-sextant.yaml:/etc/prometheus/alerts-sextant.yaml:ro

  # Grafana's all-in-one OpenTelemetry backend, to look at what ariesd
  # reports over time: a Collector that receives what ariesd pushes,
  # Prometheus, Tempo for traces, Loki for logs, and Grafana with
  # deploy/observability's dashboard, at http://127.0.0.1:3000 (the
  # port is ARIES_GRAFANA_PORT, published by the server's service). Its
  # data stays on the volume `observe`. It runs in the server's network
  # namespace, as the collector does, and takes the same ports, so run
  # it instead of the telemetry and prometheus profiles, not beside
  # them. Grafana lets anyone who reaches it in as an admin, as the
  # image does by default; it is published on 127.0.0.1 alone.
  observe:
    profiles: [observe]
    image: grafana/otel-lgtm:0.35.0@sha256:2de1094c593c671cbfca878a28ffcd7e46ff5e32f2ce966c0cf33003f6cf4266
    network_mode: service:aries
    depends_on:
      aries:
        condition: service_started
    environment:
      # Grafana downloads no plugin at start, so it reaches nothing
      # outside the machine.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Grafana opens on the Aries server dashboard, not its own welcome.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/aries/dashboards/aries.json
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    volumes:
      - observe:/data
      - ../observability/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/aries.yaml:ro
      - ../observability/dashboard.json:/etc/aries/dashboards/aries.json:ro
      - ../observability/dashboard-requests.json:/etc/aries/dashboards/aries-requests.json:ro
      - ../observability/dashboard-traces-logs.json:/etc/aries/dashboards/aries-traces-logs.json:ro
      - ../observability/dashboard-work.json:/etc/aries/dashboards/aries-work.json:ro
      - ../observability/agents-dashboard.json:/etc/aries/dashboards/aries-agents.json:ro
    healthcheck:
      test: ["CMD", "test", "-e", "/tmp/ready"]
      start_period: 120s
      start_interval: 2s
      interval: 30s

  # Keycloak, with the realm `aries` that identity.sh makes on every
  # start where it lacks one: two people, a public client for `aries
  # login`, a confidential one standing for the server and a
  # client-credentials one standing for a service principal. The
  # passwords and secrets it generates are 0600 files on the volume,
  # never printed. It listens on the same port inside and out, so that
  # its one issuer URL works from both.
  keycloak:
    profiles: [identity]
    # spike/identity ran against this release
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    entrypoint: ["bash", "/opt/aries/identity.sh"]
    init: true
    environment:
      ARIES_IDENTITY_PORT: ${ARIES_IDENTITY_PORT:-8180}
      ARIES_HTTPS_PORT: ${ARIES_HTTPS_PORT:-8443}
    ports:
      - 127.0.0.1:${ARIES_IDENTITY_PORT:-8180}:${ARIES_IDENTITY_PORT:-8180}
    networks:
      default:
        aliases: [keycloak.localhost]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - identity:/opt/keycloak/data
      - ./identity:/opt/aries:ro
    healthcheck:
      test: ["CMD", "test", "-e", "/tmp/aries-identity-ready"]
      start_period: 180s
      start_interval: 1s
      interval: 30s
volumes:
  state:
  tls:
  observe:
  postgres:
  dbsecret:
  identity:
