# The SSH port of the test server, published on 127.0.0.1. Add it beside
# compose.yaml with ARIES_SSH=1, which is what starts sshd
# (docs/deploy/docker.md, "Start it"):
#
#   ARIES_SSH=1 docker compose -f deploy/docker/compose.yaml -f deploy/docker/compose.ssh.yaml up -d --build --wait
#
# Without it no port 22 is published, so a second stack on one machine
# does not collide with the first on ARIES_PORT (aries-xbzpwrny).
services:
  aries:
    ports:
      - 127.0.0.1:${ARIES_PORT:-2222}:22
