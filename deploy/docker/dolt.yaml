# Dolt's config, as docs/server.md step 2 writes it.
log_level: info
listener:
  host: 127.0.0.1
  port: 3306
# Dolt's own metrics, on loopback only: the endpoint has no
# authentication. starfixd reads it for `sfx admin status`
# (telemetry: dolt_metrics_url: in its config).
metrics:
  host: 127.0.0.1
  port: 11228
  labels: {}
data_dir: /var/lib/dolt/data
cfg_dir: /var/lib/dolt/cfg
system_variables:
  secure_file_priv: /var/lib/dolt/no-files
