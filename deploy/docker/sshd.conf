# docs/server.md step 6 and "Keys from the store", plus what a container
# needs.
#
# The host key lives on the volume, so it survives a rebuild.
HostKey /state/hostkeys/ssh_host_ed25519_key
# Nobody signs in here but starfix's principals.
AllowUsers starfix
PasswordAuthentication no
KbdInteractiveAuthentication no
# Every client arrives through Docker's port forward, from one address.
# OpenSSH 9.8 and later would penalize that address for one bad client and
# lock out all of them, so on a newer base add: PerSourcePenalties no
MaxStartups 10:30:60
ClientAliveInterval 60
Match User starfix
    AuthenticationMethods publickey
    DisableForwarding yes
    PermitTTY no
    # sshd asks starfixd which principal a key belongs to, and falls back
    # to authorized_keys when it prints nothing. sshd runs the command
    # only if the file and every directory above it are root's and not
    # writable by group or others, which /usr/local/bin/starfixd is here:
    # the image copies it in as root, and nothing upgrades it in place.
    AuthorizedKeysCommand /usr/local/bin/starfixd keys %t %k
    AuthorizedKeysCommandUser starfix
