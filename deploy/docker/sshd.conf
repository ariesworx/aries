# docs/server.md step 6 and "Keys from the store", plus what a container
# needs.
#
# The host key lives on the volume, so it survives a rebuild.
HostKey /state/hostkeys/ssh_host_ed25519_key
# Nobody signs in here but starfix's principals.
AllowUsers starfix
PasswordAuthentication no
KbdInteractiveAuthentication no
# Every client arrives through Docker's port forward, from one address.
# OpenSSH 9.8 and later would penalize that address for one bad client and
# lock out all of them, so on a newer base add: PerSourcePenalties no
MaxStartups 10:30:60
ClientAliveInterval 60
Match User starfix
    AuthenticationMethods publickey
    DisableForwarding yes
    PermitTTY no
    # Two files, both under the account's home: authorized_keys, which
    # the entrypoint writes from STARFIX_KEYS as an operator would by
    # hand, and starfix_keys, which starfixd writes from its control
    # database. sshd takes the first line that matches, in this order,
    # and asks starfixd nothing.
    AuthorizedKeysFile .ssh/authorized_keys .ssh/starfix_keys
    AuthorizedKeysCommand none
    # A certificate authority that sshd trusts for every account (a
    # provider's or a company's) would otherwise let a certificate naming
    # this account in, with no forced command.
    TrustedUserCAKeys none
    AuthorizedPrincipalsFile none
