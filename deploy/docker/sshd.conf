# docs/server.md step 6 and "Keys from the store", plus what a container
# needs.
#
# The host key lives on the volume, so it survives a rebuild.
HostKey /state/hostkeys/ssh_host_ed25519_key
# Nobody signs in here but starfix's principals.
AllowUsers starfix
PasswordAuthentication no
KbdInteractiveAuthentication no
# Every client arrives through Docker's port forward, from one address.
# OpenSSH 9.8 and later would penalize that address for one bad client and
# lock out all of them, so on a newer base add: PerSourcePenalties no
MaxStartups 10:30:60
ClientAliveInterval 60
Match User starfix
    AuthenticationMethods publickey
    DisableForwarding yes
    PermitTTY no
    # Two files, both under the account's home: starfix_keys, which
    # starfixd writes from its control database, and authorized_keys,
    # which the entrypoint writes from STARFIX_KEYS as an operator would
    # by hand. sshd takes the first line that matches, in this order, and
    # asks starfixd nothing. The generated file comes first, so that a
    # key in both signs in by the line that names its fingerprint, and
    # `sfx admin key remove` closes its connections.
    AuthorizedKeysFile .ssh/starfix_keys .ssh/authorized_keys
    AuthorizedKeysCommand none
