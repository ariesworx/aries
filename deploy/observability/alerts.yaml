# Alert rules for one Aries server, in Prometheus's rule format, which
# most monitoring systems read or translate. They are an example that is
# tested, not a product (docs/server.md, Observability): a test in
# internal/telemetry fails if a rule names a metric, a label or a label
# value that ariesd does not have, and the Docker test server's
# `prometheus` profile loads this file into a real Prometheus.
#
# What they assume:
#   - ariesd's /metrics is scraped as job "ariesd" (prometheus.yaml
#     and collector.yaml beside this file do).
#   - The names are the ones on /metrics. Metrics that ariesd pushes
#     over OTLP arrive under their OpenTelemetry names
#     (aries.request.duration); most backends store them under these
#     same Prometheus names, and docs/server.md lists both.
#   - One ariesd. For several, add `by (instance)` to each sum.
#
# The thresholds are starting points: round numbers to be set against a
# server's own history. Postgres's own figures (connections, deadlocks,
# sizes) are in `aries admin status`, not in ariesd's metrics: watch them
# with Postgres's own exporter, such as postgres_exporter, beside these.
#
# A counter of ariesd's has no series until it first counts, and
# Prometheus sees no increase in a series' first sample. So a rule on a
# counter that should stay at nothing also fires when the series is new
# and already above zero: `m > 0 unless m offset 15m`.
#
# Not here, because no metric says it: whether /readyz answers ready.
# Probe http://127.0.0.1:9464/readyz from the machine with whatever
# probes HTTP for you; AriesdDown, AriesReaperStalled and
# AriesKeysFileWriteFailing cover the same ground from the metrics.

groups:
  - name: ariesd
    rules:
      - alert: AriesdDown
        expr: up{job="ariesd"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: ariesd's telemetry listener does not answer.
          description: >-
            Nobody can reach the tracker if ariesd is down. Run
            `systemctl status ariesd` and read `journalctl -u ariesd`.

      - alert: AriesReaperStalled
        expr: time() - aries_reaper_last_run_time_seconds > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: ariesd's reaper has not finished a tick for two minutes.
          description: >-
            The reaper runs every 30 seconds: it ends expired claims,
            rereads the control database and feeds systemd's watchdog.
            Stuck, expired claims are not returned to open, and the
            watchdog restarts ariesd after `WatchdogSec`. Look for a
            database that hangs (`/readyz`).

      - alert: AriesKeysFileWriteFailing
        expr: >-
          increase(aries_keys_file_writes_total{result="failed"}[5m]) > 0
          or (aries_keys_file_writes_total{result="failed"} > 0
          unless aries_keys_file_writes_total{result="failed"} offset 5m)
        labels:
          severity: critical
        annotations:
          summary: ariesd cannot write the keys file sshd reads.
          description: >-
            sshd is reading an older list of keys: a key that was removed
            may still sign in, and one that was added cannot. ariesd's
            log has the cause at error level, every 30 seconds
            (docs/server.md, Keys from the store).

      - alert: AriesClockBehind
        expr: aries_clock_behind_seconds > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The server's clock is behind aries's own history.
          description: >-
            ariesd serves, with its time running on from the history
            at half speed, and with `clock_behind: stop` it will not
            start again. Correct the clock (docs/server.md, The server's
            clock).

      - alert: AriesClockStepped
        expr: >-
          sum by (direction) (increase(aries_clock_steps_total[15m])) > 0
          or sum by (direction) (aries_clock_steps_total > 0
          unless aries_clock_steps_total offset 15m)
        labels:
          severity: warning
        annotations:
          summary: The server's clock was set {{ $labels.direction }}, or the machine was suspended.
          description: >-
            ariesd extended every live lease by a forward step and
            holds its time through a backward one. Find what set the
            clock: `timedatectl timesync-status`, the hypervisor's log.

      - alert: AriesProjectUnavailable
        expr: >-
          increase(aries_handshakes_total{result="unavailable"}[5m]) > 0
          or (aries_handshakes_total{result="unavailable"} > 0
          unless aries_handshakes_total{result="unavailable"} offset 5m)
        labels:
          severity: critical
        annotations:
          summary: Connections are refused because a project's database cannot be opened.
          description: >-
            ariesd's log names the project and the cause at error
            level. Most often Postgres is unreachable, or the project's
            schema is not one ariesd's role may use.

      - alert: AriesRequestsFailing
        expr: sum(rate(aries_project_requests_total{result_class="error"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: ariesd is answering requests with its own failures.
          description: >-
            `result_class="error"` is a request answered `unavailable`:
            the server's failure, not a refusal of what was asked. Read
            ariesd's log at error level, and check Postgres.

      - alert: AriesWriteLatencyHigh
        expr: >-
          histogram_quantile(0.99, sum by (le) (rate(aries_store_write_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: One write in a hundred takes more than a second.
          description: >-
            A write's time includes its wait for the project's one
            writer and any retry, so this is what a client waits. See
            AriesWritesQueueing, and
            `aries admin status` for each project's P50 and P99.

      - alert: AriesWritesQueueing
        expr: >-
          sum(rate(aries_store_write_retries_total[5m]))
          / sum(rate(aries_store_write_duration_seconds_count[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than one write in five lost to a concurrent transaction and was tried again.
          description: >-
            Writes are contending. No metric gives the wait for the
            writer alone; a trace does, in the `store.write.wait` span of
            each attempt (docs/server.md, Traces).

      - alert: AriesWritesRateLimited
        expr: >-
          sum by (limit) (increase(aries_limit_refusals_total{limit=~"write_rate|control_write_rate"}[5m])) > 0
          or sum by (limit) (aries_limit_refusals_total{limit=~"write_rate|control_write_rate"} > 0
          unless aries_limit_refusals_total{limit=~"write_rate|control_write_rate"} offset 5m)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Writes are refused at the {{ $labels.limit }} limit.
          description: >-
            A principal writes faster than the limit allows and is told
            to try again. Find who in ariesd's log, and raise the
            limit only if the load is wanted (docs/server.md, Limits).

      - alert: AriesConnectionCapReached
        expr: >-
          sum by (limit) (increase(aries_limit_refusals_total{limit=~"conns|conns_per_principal|handshakes_per_principal|handshake_sockets"}[5m])) > 0
          or sum by (limit) (aries_limit_refusals_total{limit=~"conns|conns_per_principal|handshakes_per_principal|handshake_sockets"} > 0
          unless aries_limit_refusals_total{limit=~"conns|conns_per_principal|handshakes_per_principal|handshake_sockets"} offset 5m)
        labels:
          severity: warning
        annotations:
          summary: Connections are refused at the {{ $labels.limit }} limit.
          description: >-
            `aries admin status` shows who holds the connections. Raise
            the limit under `limits:` if they are wanted (docs/server.md,
            Limits).

      - alert: AriesStoreCapReached
        expr: >-
          increase(aries_limit_refusals_total{limit="open_stores"}[5m]) > 0
          or (aries_limit_refusals_total{limit="open_stores"} > 0
          unless aries_limit_refusals_total{limit="open_stores"} offset 5m)
        labels:
          severity: warning
        annotations:
          summary: Connections are refused because too many project stores are open.
          description: >-
            Every project with a connection holds a store open, and
            `open_stores` caps them. Raise it under `limits:` with the
            database's connections in mind (docs/server.md, Limits).

      - alert: AriesDatabasePoolExhausted
        expr: >-
          increase(aries_db_pool_waits_total[5m]) > 0
          or (aries_db_pool_waits_total > 0 unless aries_db_pool_waits_total offset 5m)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Requests wait for a connection to Postgres, every one of ariesd's pool being in use.
          description: >-
            Every project's store shares one pool, of at most
            `db_conns_per_server` connections. `aries admin status`
            shows the pool and Postgres's own connections. Raise the
            limit under `limits:`, with Postgres's `max_connections`
            above it (docs/server.md, Limits).

      - alert: AriesTelemetryMetricsExportFailing
        expr: >-
          increase(aries_telemetry_dropped_total{signal="metrics"}[15m]) > 0
          or (aries_telemetry_dropped_total{signal="metrics"} > 0
          unless aries_telemetry_dropped_total{signal="metrics"} offset 15m)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: ariesd's pushes of metrics to its collector are failing.
          description: >-
            Nothing is lost for good: totals are cumulative, and the
            next push that works carries them. Requests are not slowed.
            Check the collector on the machine (docs/server.md, When the
            collector is down).

      - alert: AriesTelemetrySpansDropped
        expr: >-
          increase(aries_telemetry_dropped_total{signal="traces"}[15m]) > 0
          or (aries_telemetry_dropped_total{signal="traces"} > 0
          unless aries_telemetry_dropped_total{signal="traces"} offset 15m)
        labels:
          severity: warning
        annotations:
          summary: ariesd dropped spans it could not export.
          description: >-
            A span that is not exported is gone: the collector was down
            or refusing, or spans finished faster than the queue of
            `OTEL_BSP_MAX_QUEUE_SIZE` drained. Requests are not slowed
            (docs/server.md, When the collector is down).

      - alert: AriesTelemetryLogRecordsDropped
        expr: >-
          increase(aries_telemetry_dropped_total{signal="logs"}[15m]) > 0
          or (aries_telemetry_dropped_total{signal="logs"} > 0
          unless aries_telemetry_dropped_total{signal="logs"} offset 15m)
        labels:
          severity: warning
        annotations:
          summary: ariesd dropped log records it could not export.
          description: >-
            The records are gone from the export and the lines are not:
            the journal has every one (`journalctl -u ariesd`). The
            collector was down or refusing, or ariesd logged faster
            than the queue of `OTEL_BLRP_MAX_QUEUE_SIZE` drained. Logging
            is not slowed (docs/server.md, When the collector is down).

      # No rule here matches a log line's `event`. These are rules over
      # metrics, and nothing in this directory turns a log record into
      # one: the Collector's core distribution has no component that
      # counts records. Match `event` where the logs are read, in the
      # journal or the backend that receives the records. Three events
      # the guide says to alert on have a rule above from the metric
      # that counts the same thing: `keys_file.write_failed`
      # (AriesKeysFileWriteFailing), `project.open_failed` at a
      # handshake (AriesProjectUnavailable) and
      # `telemetry.export_failed` (the three AriesTelemetry rules).
